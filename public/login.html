<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | AI Health & Fitness Assistant</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="form-container">

        <div class="form-box">

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <button type="submit">

                    Login

                </button>

            </form>

            <p>

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
