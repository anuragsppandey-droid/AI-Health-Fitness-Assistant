<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | AI Health & Fitness Assistant</title>

    <link rel="stylesheet" href="css/profile.css">
</head>

<body>


    <!-- Navbar -->
    <nav>
        <div class="logo">
            <img src="images/logo.png" alt="AI Health & Fitness Assistant">
            AI Health & Fitness Assistant
        </div>
        <button onclick="window.location.href='dashboard.html'">Dashboard</button>
    </nav>

    <!-- Profile -->
    <main>

        <div class="profile-card">

            <div class="profile-icon">👤</div>

            <h1>My Profile</h1>

            <p class="subtitle">Your account information</p>

            <div class="profile-info">

                <div class="info-row">
                    <span>Name</span>
                    <strong id="profileName">Loading...</strong>
                </div>

                <div class="info-row">
                    <span>Email</span>
                    <strong id="profileEmail">Loading...</strong>
                </div>

                <div class="info-row">
                    <span>Account</span>
                    <strong>Active</strong>
                </div>

            </div>

            <button id="logoutBtn">Logout</button>

        </div>

    </main>

    <!-- Footer -->
    <footer>© 2026 AI Health & Fitness Assistant</footer>

    <!-- JavaScript -->
    <script src="js/profile.js"></script>

</body>

</html>
